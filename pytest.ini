[tool:pytest]
# Pytest Configuration for Smart Property Value Predictor

# Test Discovery
testpaths = .
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output Configuration
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10

# Markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests for multiple components
    api: API endpoint tests
    auth: Authentication and authorization tests
    admin: Admin panel functionality tests
    prediction: Property prediction tests
    csv: CSV upload and training tests
    security: Security vulnerability tests
    performance: Performance and load tests
    slow: Slow running tests
    database: Database operation tests

# Minimum Version
minversion = 6.0

# Test Session Configuration
console_output_style = progress
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage Configuration
addopts = --cov=. --cov-report=html --cov-report=term-missing --cov-fail-under=80

# Filtering
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:flask_login.*

# Timeout Configuration
timeout = 300
timeout_method = thread
